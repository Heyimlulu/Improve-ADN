<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>ADN Improver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img class="header-logo" src="../icons/icon-64x64.png" alt="" width="28" height="28">
    <h1 data-i18n="extName">ADN Improver</h1>
    <span class="header-version" id="version"></span>
  </header>

  <main class="content">
    <section class="settings" id="settings"></section>

    <section class="card">
      <h2 data-i18n="alwaysOnTitle"></h2>
      <ul class="always-on" id="always-on"></ul>
    </section>

    <section class="card">
      <h2 data-i18n="shortcutsListTitle"></h2>
      <div class="shortcut-list" id="shortcuts"></div>
    </section>
  </main>

  <footer class="footer">
    <p data-i18n="watchPageNote"></p>
    <nav class="links">
      <a href="https://github.com/Heyimlulu/Improve-ADN" target="_blank" rel="noopener" data-i18n="viewOnGithub"></a>
      <a href="https://github.com/Heyimlulu/Improve-ADN/issues" target="_blank" rel="noopener" data-i18n="reportIssue"></a>
    </nav>
  </footer>

  <template id="tpl-switch">
    <label class="row">
      <span class="row-text">
        <span class="row-label"></span>
        <span class="row-desc"></span>
      </span>
      <span class="switch">
        <input type="checkbox">
        <span class="switch-track"></span>
      </span>
    </label>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
