<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>ADN Improver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img class="header-logo" src="../icons/icon-64x64.png" alt="" width="26" height="26">
    <h1 data-i18n="extName">ADN Improver</h1>
    <span class="header-version" id="version"></span>
  </header>

  <main class="content">
    <!-- Home: one tile per switch, plus two information tiles -->
    <section class="view is-active" id="view-home">
      <div class="tiles" id="tiles"></div>
      <p class="note" data-i18n="watchPageNote"></p>
    </section>

    <!-- Keyboard shortcuts -->
    <section class="view" id="view-shortcuts">
      <div class="view-header">
        <button type="button" class="back" data-back data-i18n-attr="aria-label:back,title:back"></button>
        <h2 data-i18n="shortcutsListTitle"></h2>
      </div>
      <div class="shortcut-list" id="shortcuts"></div>
    </section>

    <!-- Always-on features -->
    <section class="view" id="view-included">
      <div class="view-header">
        <button type="button" class="back" data-back data-i18n-attr="aria-label:back,title:back"></button>
        <h2 data-i18n="alwaysOnTitle"></h2>
      </div>
      <ul class="always-on" id="always-on"></ul>
    </section>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
