<script>
  // Minimal video.js-like behaviour: toggle user-inactive class after 1.5 s without mouse moves.
  const player = document.getElementById('player');
  const video = document.getElementById('video');
  let timer;
  function active() { player.classList.remove('vjs-user-inactive'); clearTimeout(timer); timer = setTimeout(() => player.classList.add('vjs-user-inactive'), 1500); }
  document.addEventListener('mousemove', active);
  video.addEventListener('play', () => { player.classList.add('vjs-playing'); player.classList.remove('vjs-paused'); active(); });
  video.addEventListener('pause', () => { player.classList.remove('vjs-playing'); player.classList.add('vjs-paused'); });
  video.addEventListener('click', () => video.paused ? video.play() : video.pause());
  player.classList.add('vjs-paused');
</script>
